name: Build Sim Custom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build simstudio image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (ubuntu-latest preinstalls ~25GB of unused tooling)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune --force || true
          df -h /

      - name: Add swap (next build peak exceeds runner RAM)
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/samalehzen/hyperfixsim/sim-custom:latest
            ghcr.io/samalehzen/hyperfixsim/sim-custom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
